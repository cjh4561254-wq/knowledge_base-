name: kb-services

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: kb-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - D:/kb_services/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus 自带的对象存储（本机拉不到 minio/minio 镜像，改用 bitnamilegacy 里的同款二进制）
  minio:
    image: bitnamilegacy/minio:latest
    container_name: kb-milvus-minio
    entrypoint: ["/opt/bitnami/minio/bin/minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - D:/kb_services/volumes/milvus-minio:/data
    ports:
      - "9000:9000"
      - "9002:9001"
    healthcheck:
      # 该镜像里没有 mc 客户端（只有 /opt/bitnami/minio/bin/minio），
      # 用 `mc ready local` 会永远失败并误报 unhealthy；curl 才是在的。
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.27
    container_name: kb-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - D:/kb_services/volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  mongo:
    image: mongo:7
    container_name: kb-mongo
    volumes:
      - D:/kb_services/volumes/mongo:/data/db
    ports:
      - "27017:27017"

  # 应用侧对象存储（存 PDF 转出来的图片），与 Milvus 内部的 9000 分开
  app-minio:
    image: bitnamilegacy/minio:latest
    container_name: kb-app-minio
    entrypoint: ["/opt/bitnami/minio/bin/minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - D:/kb_services/volumes/app-minio:/data
    ports:
      - "9100:9000"
      - "9101:9001"
