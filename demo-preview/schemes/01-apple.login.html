<!--
  方案编号：01
  风格名：Apple 苹果风
  负责的子智能体：Sub-Agent-Apple-Motion（登录页视图）
  设计系统要点：
  1. 极简纯净底 #F5F5F7 + 一层极淡径向高光，内容全部收在 max-width 420px 的圆角 20px 白卡片里（唯一毛玻璃层）。
  2. 文字层级用字重而非色彩：#1D1D1F 主文 / #86868B 次要；正文 17px；唯一强调色 #0071E3 品牌蓝。
  3. 动效统一 cubic-bezier(.4,0,.2,1) 且 ≤400ms；胶囊按钮 radius 980px；微交互（显隐密码、勾选圆点、校验抖动、逐行进场）承担质感。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · BOSS智库知识库 · 方案 01 Apple 苹果风</title>
<style>
  :root{
    --bg:#F5F5F7;
    --card:#FFFFFF;
    --ink:#1D1D1F;
    --muted:#6E6E73;          /* 次要文字：白底 ≈5.1:1，达 WCAG AA（原 #86868B 仅 3.9:1，弃用） */
    --blue:#0071E3;
    --blue-hi:#0A82F5;
    --field:#F5F5F7;
    --line:#D2D2D7;
    --err:#FF3B30;            /* 错误描边（Apple 语义红 token） */
    --err-ink:#D70015;        /* 错误文字：白底 5.4:1，达 AA */
    --ok:#34C759;
    --radius:20px;
    --pill:980px;
    --ease:cubic-bezier(.4,0,.2,1);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--font);
    font-size:17px;
    line-height:1.47;
    color:var(--ink);
    background-color:var(--bg);
    background-image:
      radial-gradient(1100px 620px at 50% -18%, rgba(255,255,255,.95), rgba(245,245,247,0) 62%),
      radial-gradient(760px 520px at 88% 106%, rgba(0,113,227,.055), rgba(245,245,247,0) 60%);
    background-repeat:no-repeat;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  h1,p{margin:0}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:inherit}

  /* ---------- 顶部条（局部毛玻璃的第二层，极轻） ---------- */
  .topbar{
    position:sticky;top:0;z-index:5;
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 24px;
    background:rgba(245,245,247,.72);
    backdrop-filter:saturate(160%) blur(12px);
    -webkit-backdrop-filter:saturate(160%) blur(12px);
    border-bottom:1px solid rgba(0,0,0,.06);
  }
  .topbar .brand-mini{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:-.01em}
  .topbar .brand-mini svg{display:block}
  .topbar .hint{font-size:12px;color:var(--muted)}

  /* ---------- 舞台 ---------- */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px 8px}

  .card{
    position:relative;
    width:100%;max-width:420px;
    background:rgba(255,255,255,.82);
    backdrop-filter:saturate(180%) blur(22px);
    -webkit-backdrop-filter:saturate(180%) blur(22px);
    border:1px solid rgba(0,0,0,.055);
    border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(0,0,0,.03),0 18px 44px rgba(0,0,0,.08);
    padding:36px 32px 28px;
  }
  /* 进场动画挂到一次性类上，动画结束后移除，避免抖动动画结束时重播进场 */
  .card.enter{animation:card-in 380ms var(--ease) both}
  @keyframes card-in{from{opacity:0;transform:translateY(18px) scale(.986)}to{opacity:1;transform:none}}

  /* ---------- 品牌区：逐行错落进场 stagger 60ms ---------- */
  .brand{text-align:center;margin-bottom:26px}
  .brand .logo{
    width:56px;height:56px;margin:0 auto 14px;
    display:block;
    animation:line-in 320ms var(--ease) 0ms both;
  }
  .brand .name{
    font-size:26px;font-weight:700;letter-spacing:-.022em;line-height:1.2;
    animation:line-in 320ms var(--ease) 60ms both;
  }
  .brand .sub{
    margin-top:8px;font-size:15px;color:var(--muted);letter-spacing:-.01em;
    animation:line-in 320ms var(--ease) 120ms both;
  }
  @keyframes line-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---------- 表单 ---------- */
  .field{margin-bottom:16px;animation:line-in 320ms var(--ease) 180ms both}
  .field label{
    display:block;font-size:13px;font-weight:600;color:var(--ink);
    letter-spacing:-.01em;margin-bottom:6px;
  }
  .wrap{position:relative}
  .wrap input{
    width:100%;
    font-family:inherit;font-size:16px;color:var(--ink);
    background:var(--field);
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px 15px;
    transition:border-color 220ms var(--ease),background-color 220ms var(--ease),box-shadow 220ms var(--ease);
    outline:none;
  }
  .wrap input::placeholder{color:var(--muted);opacity:1}
  /* Apple 的 focus 观感：描边转品牌蓝并平滑“加粗”（用 1px box-shadow 补厚，避免 border-width 抖动） */
  .wrap input:focus{
    border-color:var(--blue);
    background:#fff;
    box-shadow:0 0 0 1px var(--blue);
  }
  .wrap:has(input:focus-visible) input{
    box-shadow:0 0 0 1px var(--blue),0 0 0 4px rgba(0,113,227,.22);
  }
  .wrap.has-suffix input{padding-right:46px}

  .suffix-btn{
    position:absolute;top:50%;right:6px;transform:translateY(-50%);
    width:34px;height:34px;
    display:grid;place-items:center;
    background:transparent;border:0;border-radius:10px;
    color:var(--muted);cursor:pointer;
    transition:color 180ms var(--ease),background-color 180ms var(--ease),transform 180ms var(--ease);
  }
  .suffix-btn:hover{color:var(--ink);background:rgba(0,0,0,.045)}
  .suffix-btn:active{transform:translateY(-50%) scale(.94)}
  .suffix-btn:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  /* 眼睛图标形变过渡：镜框压扁 + 斜线 stroke-dashoffset 描出 */
  .suffix-btn svg .lid{transition:transform 260ms var(--ease);transform-origin:center}
  .suffix-btn svg .pupil{transition:opacity 200ms var(--ease),transform 240ms var(--ease);transform-origin:center}
  .suffix-btn svg .slash{
    stroke-dasharray:26;stroke-dashoffset:26;
    transition:stroke-dashoffset 280ms var(--ease);
  }
  .card[data-pw="off"] .suffix-btn svg .lid{transform:scaleY(.52)}
  .card[data-pw="off"] .suffix-btn svg .pupil{opacity:0;transform:scale(.4)}
  .card[data-pw="off"] .suffix-btn svg .slash{stroke-dashoffset:0}

  /* ---------- 错误态 ---------- */
  .err-msg{
    display:flex;align-items:center;gap:6px;
    margin-top:7px;font-size:13px;color:var(--err-ink);letter-spacing:-.01em;
    opacity:0;transform:translateY(-3px);
    transition:opacity 220ms var(--ease),transform 220ms var(--ease);
    pointer-events:none;
  }
  .err-msg svg{flex:none}
  .field.is-error .err-msg{opacity:1;transform:none}
  .field.is-error input{border-color:var(--err);background:#fff}
  .field.is-error input:focus{box-shadow:0 0 0 1px var(--err)}
  .field.is-error input:focus-visible{box-shadow:0 0 0 1px var(--err),0 0 0 4px rgba(255,59,48,.2)}
  /* 校验失败：卡片轻微左右摇动，240ms / 3 关键帧 */
  @keyframes shake{0%,100%{transform:translateX(0)}33%{transform:translateX(-6px)}66%{transform:translateX(6px)}}
  .card.shake{animation:shake 240ms var(--ease) 1}

  /* ---------- 记住我 + 忘记密码 ---------- */
  .row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin:4px 0 22px;animation:line-in 320ms var(--ease) 240ms both;
  }
  .remember{position:relative;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--ink);user-select:none}
  .remember input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  .box{
    width:19px;height:19px;flex:none;
    border:1px solid var(--line);border-radius:6px;background:#fff;
    display:grid;place-items:center;
    transition:border-color 200ms var(--ease),background-color 200ms var(--ease);
  }
  /* 品牌蓝实心圆点：scale 进场 + 外圈淡出 */
  .dot{
    width:9px;height:9px;border-radius:50%;background:var(--blue);
    transform:scale(0);
    transition:transform 260ms var(--ease);
  }
  .ring{
    position:absolute;inset:0;border-radius:6px;
    border:2px solid var(--blue);opacity:0;transform:scale(1);
    pointer-events:none;
  }
  .box-holder{position:relative;display:grid;place-items:center}
  /* 勾选瞬间：品牌蓝实心圆点 scale 进场 + 外圈淡出涟漪 */
  .remember:has(input:checked) .ring{animation:pulse 300ms var(--ease)}
  @keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(1.85);opacity:0}}
  .remember input:checked + .box-holder .box{border-color:var(--blue)}
  .remember input:checked + .box-holder .dot{transform:scale(1)}
  .remember:has(input:focus-visible) .box{outline:2px solid var(--blue);outline-offset:2px}
  .forgot{font-size:14px}
  .forgot:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}

  /* ---------- 主 CTA ---------- */
  .cta{
    position:relative;
    width:100%;height:48px;
    border:0;border-radius:var(--pill);
    background:var(--blue);color:#fff;
    font-size:17px;font-weight:600;letter-spacing:-.01em;
    cursor:pointer;
    display:grid;place-items:center;
    transition:background-color 200ms var(--ease),transform 160ms var(--ease),box-shadow 220ms var(--ease),opacity 200ms var(--ease);
    animation:line-in 320ms var(--ease) 300ms both;
  }
  .cta:hover{background:var(--blue-hi);box-shadow:0 6px 18px rgba(0,113,227,.28)}
  .cta:active{transform:scale(.98)}
  .cta:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .cta[disabled]{background:#C7C7CC;color:#fff;cursor:not-allowed;box-shadow:none;transform:none}
  .cta .label{transition:opacity 180ms var(--ease)}
  /* loading：内联 SVG 环形进度（stroke-dasharray/dashoffset 开口 + 整体旋转） */
  .cta .spinner{
    position:absolute;left:50%;top:50%;
    width:22px;height:22px;margin:-11px 0 0 -11px;
    opacity:0;transition:opacity 180ms var(--ease);
  }
  .cta .spinner svg{display:block;animation:spin 900ms linear infinite}
  .cta .spinner .arc{stroke-dasharray:56;stroke-dashoffset:42}
  @keyframes spin{to{transform:rotate(360deg)}}
  .cta[data-loading="1"]{pointer-events:none}
  .cta[data-loading="1"] .label{opacity:0}
  .cta[data-loading="1"] .spinner{opacity:1}

  /* ---------- 成功态 ---------- */
  .done{
    display:none;text-align:center;padding:6px 0 2px;
  }
  .card[data-state="success"] .done{display:block;animation:line-in 320ms var(--ease) both}
  .card[data-state="success"] form{display:none}
  .done .tick{width:52px;height:52px;margin:0 auto 12px}
  .done .tick circle{fill:rgba(52,199,89,.12)}
  .done .tick path{
    stroke:var(--ok);stroke-width:2.5;fill:none;stroke-linecap:round;
    stroke-dasharray:24;stroke-dashoffset:24;
    animation:draw 360ms var(--ease) 120ms forwards;
  }
  @keyframes draw{to{stroke-dashoffset:0}}
  .done h2{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
  .done p{font-size:14px;color:var(--muted);margin:0 0 18px}
  .ghost{
    width:100%;height:44px;border-radius:var(--pill);
    background:transparent;border:1px solid var(--line);
    color:var(--blue);font-size:16px;font-weight:600;cursor:pointer;
    transition:background-color 180ms var(--ease),transform 160ms var(--ease),border-color 180ms var(--ease);
  }
  .ghost:hover{background:rgba(0,113,227,.06);border-color:rgba(0,113,227,.35)}
  .ghost:active{transform:scale(.98)}
  .ghost:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  /* ---------- Mock 凭据提示（Demo 专用，12px 次要文字） ---------- */
  .mock-hint{
    margin:10px 0 0;text-align:center;
    font-size:12px;color:var(--muted);letter-spacing:-.01em;
    animation:line-in 320ms var(--ease) 330ms both;
  }
  .mock-hint b{font-weight:600;color:var(--ink)}

  /* ---------- 分隔线 + 第三方 ---------- */
  .divider{
    display:flex;align-items:center;gap:12px;
    margin:24px 0 16px;
    font-size:12px;color:var(--muted);letter-spacing:.02em;
    animation:line-in 320ms var(--ease) 360ms both;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .sso{
    display:flex;align-items:center;justify-content:center;gap:14px;
    animation:line-in 320ms var(--ease) 400ms both;
  }
  .sso button{
    width:44px;height:44px;border-radius:50%;
    border:1px solid var(--line);background:#fff;color:var(--ink);
    display:grid;place-items:center;cursor:pointer;
    transition:transform 220ms var(--ease),box-shadow 220ms var(--ease),border-color 220ms var(--ease);
  }
  .sso button:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.1);border-color:rgba(0,0,0,.12)}
  .sso button:active{transform:translateY(-1px) scale(.97)}
  .sso button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .sso-note{
    min-height:18px;margin-top:12px;text-align:center;
    font-size:12px;color:var(--muted);letter-spacing:-.01em;
    opacity:0;transition:opacity 220ms var(--ease);
  }
  .sso-note.show{opacity:1}

  /* ---------- 页脚 ---------- */
  footer{
    padding:20px 16px 26px;text-align:center;
    font-size:12px;color:var(--muted);letter-spacing:-.005em;
  }
  footer .links{margin-top:6px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  footer a{color:var(--muted)}
  footer a:hover{color:var(--blue);text-decoration:none}
  footer a:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}

  .skip{position:absolute;left:-9999px}
  .skip:focus{left:12px;top:12px;z-index:20;background:#fff;color:var(--blue);padding:8px 14px;border-radius:var(--pill)}

  /* ---------- 响应式 ---------- */
  @media (max-width:1024px){ .card{padding:32px 28px 24px} .brand .name{font-size:24px} }
  @media (max-width:768px){
    body{font-size:16px}
    .stage{padding:28px 16px 4px;align-items:flex-start}
    .card{max-width:100%}
    .topbar .hint{display:none}
  }
  @media (max-width:390px){
    .card{padding:26px 18px 20px;border-radius:18px}
    .brand .logo{width:48px;height:48px}
    .brand .name{font-size:21px}
    .brand .sub{font-size:14px}
    .field{margin-bottom:14px}
    .row{flex-direction:row;gap:10px}
    .sso{gap:10px}
    .sso button{width:42px;height:42px}
    .cta{height:46px;font-size:16px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
    .cta .spinner svg{animation:spin 1.2s linear infinite}
  }
</style>
</head>
<body>
<a class="skip" href="#account">跳到登录表单</a>

<header class="topbar">
  <span class="brand-mini">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="7" y="10" width="34" height="9" rx="4.5" fill="#1D1D1F"/>
      <rect x="11" y="22" width="26" height="8" rx="4" fill="#86868B"/>
      <rect x="16" y="33" width="16" height="7" rx="3.5" fill="#0071E3"/>
    </svg>
    BOSS智库知识库
  </span>
  <span class="hint">方案 01 · Apple 苹果风 · 登录页 Demo</span>
</header>

<main class="stage">
  <section class="card enter" id="card" data-pw="on" data-state="form" aria-labelledby="ttl">
    <!-- 品牌区 -->
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" role="img" aria-label="BOSS智库知识库标志">
        <rect x="7" y="9" width="34" height="9" rx="4.5" fill="#1D1D1F"/>
        <rect x="11" y="21" width="26" height="8" rx="4" fill="#86868B"/>
        <rect x="16" y="32" width="16" height="7" rx="3.5" fill="#0071E3"/>
      </svg>
      <h1 class="name" id="ttl">BOSS智库知识库</h1>
      <p class="sub">用知识库回答问题，而不是搜索引擎</p>
    </div>

    <form id="form" novalidate autocomplete="on">
      <div class="field" id="f-account">
        <label for="account">账号</label>
        <div class="wrap">
          <input id="account" name="account" type="text" value="boss_admin"
                 placeholder="手机号 / 邮箱 / 用户名" autocomplete="username" aria-describedby="e-account" />
        </div>
        <p class="err-msg" id="e-account" role="alert">
          <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.4v4.2M8 11.4h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>请输入账号（手机号 / 邮箱 / 用户名）</span>
        </p>
      </div>

      <div class="field is-error" id="f-password">
        <label for="password">密码</label>
        <div class="wrap has-suffix">
          <input id="password" name="password" type="password" value="Wrong#Pass2026"
                 placeholder="请输入密码" autocomplete="current-password" aria-describedby="e-password" />
          <button type="button" class="suffix-btn" id="pw-toggle"
                  aria-label="显示密码" aria-pressed="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path class="lid" d="M2.2 12S6 5.8 12 5.8 21.8 12 21.8 12 18 18.2 12 18.2 2.2 12 2.2 12Z"/>
              <circle class="pupil" cx="12" cy="12" r="2.9"/>
              <path class="slash" d="M4 20 20 4"/>
            </svg>
          </button>
        </div>
        <p class="err-msg" id="e-password" role="alert">
          <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.4v4.2M8 11.4h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>用户名或密码错误</span>
        </p>
      </div>

      <div class="row">
        <label class="remember">
          <input type="checkbox" id="remember" name="remember" checked />
          <span class="box-holder">
            <span class="box" aria-hidden="true"><span class="dot"></span></span>
            <span class="ring" aria-hidden="true"></span>
          </span>
          <span>记住我</span>
        </label>
        <a class="forgot" href="#forgot" id="forgot">忘记密码？</a>
      </div>

      <button type="submit" class="cta" id="submit">
        <span class="label">登录</span>
        <span class="spinner" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle class="track" cx="12" cy="12" r="9" stroke="rgba(255,255,255,.32)" stroke-width="2.4"/>
            <circle class="arc" cx="12" cy="12" r="9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </span>
      </button>

      <p class="mock-hint">Demo 账号 <b>boss_admin</b> · 密码 <b>kb2026</b>（仅本地校验，不联网）</p>

      <div class="divider"><span>或使用企业身份登录</span></div>

      <div class="sso">
        <button type="button" class="sso-btn" aria-label="使用企业微信登录" data-name="企业微信">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9.3 3.4c4.2 0 7.5 2.7 7.5 6 0 .5-.1 1-.2 1.4l-1.6-.5c-1-2.9-3.3-4.4-5.9-4.4-.4 0-.8 0-1.2.1C5.6 4.4 7.3 3.4 9.3 3.4Z" fill="#1D1D1F"/>
            <path d="M8.2 8.1c3.3 0 6 2.2 6 4.9 0 2.7-2.7 4.9-6 4.9-.6 0-1.2-.1-1.8-.2L4 18.9l.7-2.1c-1.1-.9-1.8-2.2-1.8-3.6 0-2.8 2.9-5.1 5.3-5.1Z" fill="#86868B"/>
            <circle cx="6.4" cy="12.2" r=".95" fill="#fff"/><circle cx="9.9" cy="12.2" r=".95" fill="#fff"/>

            <path d="M17.4 9.2c-.6 1.6-2.4 4.1-3.6 5.4.6-.2 2.4-.9 3.4-1.6.4-.3.7.1.5.5-.5 1.1-1.7 2.6-2.7 3.4-.3.2-.7.5-1.1.7l1 .8c.2.2.1.5-.2.5-1.5.1-3.1-.1-3.4-.3-.4-.2-.2-.5.1-.7l1-.7c-1.3-.5-2.5-1.3-2.2-2 .2-.5.9-.4 1.6-.2-1-.8-1.7-1.8-1.4-2.5.2-.5.8-.4 1.5-.1-.6-.8-1-1.7-.7-2.2.3-.6 1-.3 1.7.3.7.6 1.3 1.4 1.6 2.2.5-1.4.2-3-.4-3.9-.2-.3.1-.6.4-.5 1.2.4 2.2 1.5 2.6 2.9Z" fill="#fff"/>
          </svg>
        </button>
        <button type="button" class="sso-btn" aria-label="使用飞书登录" data-name="飞书">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4.2 6.8c1.9-.4 4.1.6 5.7 2.1 1.7 1.6 3 3.6 3.6 5.3-2 .3-4.2-.6-5.9-2.2C5.9 10.4 4.6 8.4 4.2 6.8Z" fill="#0071E3"/>

      </svg>
      <h2>登录成功</h2>
      <p id="done-detail">正在进入 BOSS智库知识库 · 已记住本机（14 天）</p>

  <div>© 2026 BOSS智库 · 企业级智能知识库系统</div>

    <a href="#terms">服务条款</a>
    <a href="#help">使用帮助</a>
  </div>
</footer>

<script>
(function () {
  'use strict';

  var card = document.getElementById('card');
  var form = document.getElementById('form');
  var account = document.getElementById('account');
  var password = document.getElementById('password');
  var pwToggle = document.getElementById('pw-toggle');
  var submit = document.getElementById('submit');
  var remember = document.getElementById('remember');
  var forgot = document.getElementById('forgot');
  var note = document.getElementById('sso-note');
  var back = document.getElementById('back');
  var doneDetail = document.getElementById('done-detail');

  var fAccount = document.getElementById('f-account');
  var fPassword = document.getElementById('f-password');

  /* Mock 凭据：契约第 3 节范围内写死，不发任何请求 */
  var MOCK_USER = 'boss_admin';
  var MOCK_PASS = 'kb2026';

  function clearError(fieldEl) { fieldEl.classList.remove('is-error'); }

  function setError(fieldEl, msg) {
    var span = fieldEl.querySelector('.err-msg span');
    if (span && msg) span.textContent = msg;
    fieldEl.classList.add('is-error');
  }

  /* 校验失败 → 卡片轻微左右摇动（错误文案与红描边由 CSS 淡入） */
  function shake() {
    card.classList.remove('shake');
    /* 强制重排，保证同一动画可连续重放 */
    void card.offsetWidth;
    card.classList.add('shake');
    /* 兜底：页面处于后台时 animationend 不触发，也要摘掉抖动类 */
    window.clearTimeout(shakeTimer);
    shakeTimer = window.setTimeout(function () { card.classList.remove('shake'); }, 320);
  }
  var shakeTimer = 0;
  card.addEventListener('animationend', function (e) {
    if (e.animationName === 'shake') card.classList.remove('shake');
    if (e.animationName === 'card-in') card.classList.remove('enter');
  });
  /* 兜底：reduced-motion 或 animationend 未触发时也要摘掉进场类 */
  window.setTimeout(function () { card.classList.remove('enter'); }, 900);

  [account, password].forEach(function (input) {
    input.addEventListener('input', function () {
      clearError(input === account ? fAccount : fPassword);
      syncSubmitState();
    });
  });

  function syncSubmitState() {
    var empty = account.value.trim() === '' && password.value === '';
    submit.disabled = empty;
  }

  /* 1) 密码显示 / 隐藏（眼睛图标形变） */
  pwToggle.addEventListener('click', function () {
    var showing = pwToggle.getAttribute('aria-pressed') === 'true';
    pwToggle.setAttribute('aria-pressed', showing ? 'false' : 'true');
    pwToggle.setAttribute('aria-label', showing ? '显示密码' : '隐藏密码');
    password.type = showing ? 'password' : 'text';
    card.setAttribute('data-pw', showing ? 'on' : 'off');
    password.focus({ preventScroll: true });
  });

  /* 2) 记住我：勾选态由 CSS 圆点动画完成，这里只同步无障碍与副文案 */
  remember.addEventListener('change', function () {
    if (card.getAttribute('data-state') === 'success') {
      doneDetail.textContent = remember.checked
        ? '正在进入 BOSS智库知识库 · 已记住本机（14 天）'
        : '正在进入 BOSS智库知识库 · 本次会话有效';
    }
  });

  /* 3) 提交：本地校验 + loading 环形进度 + 成功态 */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (submit.getAttribute('data-loading') === '1') return;

    var acc = account.value.trim();
    var bad = [];
    clearError(fAccount); clearError(fPassword);

    if (!acc) { setError(fAccount, '请输入账号（手机号 / 邮箱 / 用户名）'); bad.push(account); }
    if (!password.value) { setError(fPassword, '请输入密码'); bad.push(password); }

    if (bad.length) {
      shake();
      bad[0].focus({ preventScroll: true });
      return;
    }

    if (acc !== MOCK_USER || password.value !== MOCK_PASS) {
      /* 契约 2.3 要求的错误文案：用户名或密码错误 */
      setError(fPassword, '用户名或密码错误');
      shake();
      password.focus({ preventScroll: true });
      return;
    }

    submit.setAttribute('data-loading', '1');
    submit.setAttribute('aria-busy', 'true');
    window.setTimeout(function () {
      submit.removeAttribute('data-loading');
      submit.removeAttribute('aria-busy');
      card.setAttribute('data-state', 'success');
      remember.dispatchEvent(new Event('change'));
      back.focus({ preventScroll: true });
    }, 1200);
  });

  back.addEventListener('click', function () {
    card.setAttribute('data-state', 'form');
    password.value = '';
    syncSubmitState();
    account.focus({ preventScroll: true });
  });

  /* 4) 第三方登录：本地提示，不联网 */
  var timers = [];
  function say(text) {
    note.textContent = text;
    note.classList.add('show');
    timers.push(window.setTimeout(function () { note.classList.remove('show'); }, 2600));
  }
  Array.prototype.forEach.call(document.querySelectorAll('.sso-btn'), function (btn) {
    btn.addEventListener('click', function () {
      say('正在拉起 ' + btn.dataset.name + ' 授权 · Demo 不发起真实网络请求');
    });
  });

  forgot.addEventListener('click', function (e) {
    e.preventDefault();
    say('请联系知识库管理员重置密码（Demo 模拟，未发起请求）');
  });

  /* Enter 直接提交由原生表单行为承担；此处仅初始化状态 */
  syncSubmitState();
})();
</script>
</body>
</html>
