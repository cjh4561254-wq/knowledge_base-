<!DOCTYPE html>
<!--
  方案编号: 06 · 风格名: Airbnb 温暖人文风 · 负责子智能体: Sub-Agent-Airbnb-Card · 视图: 登录页
  设计系统要点:
  1) 轻盈通透: 大面积纯白 + 单一珊瑚红 CTA(#FF5A5F→#FF385C), 登录卡片像房源卡(圆角22px, 静止无阴影/聚焦才浮起)。
  2) 排版克制: 标题700但22-26px, 行高1.5, 正文16px, 数字 tabular-nums; 输入与 chip 胶囊化; 文字 #222/次要 #717171/分隔 #EBEBEB。
  3) 圆形图标按钮(40-44px 细描边/hover底色)贯穿第三方登录与显隐切换; 背景视觉用低透明暖色 blob(内联SVG), 离线安全。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · BOSS智库知识库 · 方案06 Airbnb 温暖人文风</title>
<style>
  :root{
    --raus:#FF5A5F; --raus2:#FF385C; --ink:#222222; --sub:#717171;
    --line:#EBEBEB; --bg:#FFFFFF; --bg2:#F7F7F7; --err:#FF385C; --green:#008A05;
    --r-card:22px; --r-btn:12px; --r-chip:999px;
    --sh-hover:0 8px 28px rgba(0,0,0,.12);
    --font:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.5;font-size:16px;
    -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- ambient background (inline svg blobs, warm + airy) ---------- */
  .bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(0);opacity:.13}
  .blob.b1{width:520px;height:520px;top:-160px;left:-120px;background:radial-gradient(circle at 30% 30%,#FF5A5F,transparent 62%)}
  .blob.b2{width:460px;height:460px;bottom:-140px;right:-100px;background:radial-gradient(circle at 60% 40%,#FFB54A,transparent 60%)}
  .blob.b3{width:300px;height:300px;top:40%;right:12%;background:radial-gradient(circle at 50% 50%,#7A6BF2,transparent 65%)}
  .brand-strip{position:fixed;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--raus),var(--raus2))}

  /* ---------- top mini nav ---------- */
  .topline{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,4vw,40px)}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px}
  .logo svg{display:block}
  .topline .mini-link{font-size:13.5px;color:var(--ink);text-decoration:none;font-weight:600;border:1px solid var(--line);
    border-radius:var(--r-chip);padding:8px 16px;cursor:pointer;background:#fff;transition:background .2s}
  .topline .mini-link:hover{background:var(--bg2)}

  /* ---------- center ---------- */
  .wrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:12px clamp(16px,4vw,40px) 24px}
  .card{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);
    padding:34px 32px;position:relative;transition:box-shadow .25s,transform .25s}
  .card::after{content:"";position:absolute;inset:0;border-radius:var(--r-card);box-shadow:var(--sh-hover);
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:-1}
  .card:focus-within::after,.card:hover::after{opacity:1}
  .card:focus-within{transform:translateY(-2px)}

  .card .head{text-align:center;margin-bottom:22px}
  .mark{width:56px;height:56px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
  .head h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.4px;line-height:1.35}
  .head p{margin:8px 0 0;color:var(--sub);font-size:14.5px;line-height:1.5}

  /* form */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
  .inp{position:relative;display:flex;align-items:center;border:1px solid var(--ink);border-radius:var(--r-btn);
    background:#fff;transition:border-color .2s,box-shadow .2s}
  .inp:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .inp input{flex:1;border:0;outline:0;background:transparent;padding:14px 16px;font-size:15px;color:var(--ink);
    font-family:inherit;min-width:0}
  .inp input::placeholder{color:#9a9a9a}
  .inp:focus-within{box-shadow:0 0 0 3px rgba(34,34,34,.10)}
  .eye{width:38px;height:38px;flex:0 0 auto;margin-right:6px;border-radius:50%;border:0;background:transparent;
    cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub);transition:background .2s}
  .eye:hover{background:var(--bg2)}
  .inp.err{border-color:var(--err)}
  .inp.err:focus-within{box-shadow:0 0 0 3px rgba(255,56,92,.14)}
  .msg-err{display:none;color:var(--err);font-size:12.5px;font-weight:600;margin-top:7px;align-items:center;gap:6px}
  .msg-err.show{display:flex}

  /* global error banner (static demonstration of error state) */
  .banner{display:flex;gap:10px;align-items:flex-start;background:#fff0f0;border:1px solid #ffd4d4;color:var(--err);
    border-radius:var(--r-btn);padding:12px 14px;font-size:13.5px;font-weight:600;margin-bottom:16px}
  .banner.hide{display:none}
  .banner svg{flex:0 0 auto;margin-top:1px}

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 20px;flex-wrap:wrap}
  .remember{display:inline-flex;align-items:center;gap:9px;font-size:14px;color:var(--ink);cursor:pointer;font-weight:600}
  .remember input{position:absolute;opacity:0;width:0;height:0}
  .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--ink);display:inline-flex;align-items:center;
    justify-content:center;transition:background .18s,border-color .18s}
  .box svg{opacity:0;transform:scale(.6);transition:.15s}
  .remember input:checked + .box{background:var(--ink);border-color:var(--ink)}
  .remember input:checked + .box svg{opacity:1;transform:scale(1)}
  .remember input:focus-visible + .box{outline:2px solid var(--ink);outline-offset:2px}
  .forgot{font-size:13.5px;color:var(--ink);font-weight:700;text-decoration:none;border-bottom:2px solid transparent}
  .forgot:hover{border-bottom-color:var(--ink)}

  .cta{width:100%;border:0;border-radius:var(--r-btn);background:linear-gradient(135deg,var(--raus),var(--raus2));
    color:#fff;font-size:16px;font-weight:700;padding:15px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:10px;transition:filter .18s,transform .12s,box-shadow .2s;font-family:inherit}
  .cta:hover{filter:brightness(1.05);box-shadow:0 8px 22px rgba(255,58,92,.34)}
  .cta:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .cta:active{transform:scale(.985)}
  .cta:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;filter:none}
  .spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;
    display:none;animation:spin .7s linear infinite}
  .cta.loading .spinner{display:inline-block}
  .cta.loading .lbl-txt::after{content:"…"}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* divider */
  .divider{display:flex;align-items:center;gap:14px;margin:22px 0;color:var(--sub);font-size:12.5px;font-weight:600}
  .divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}

  /* third party */
  .oauth{display:flex;justify-content:center;gap:14px}
  .oauth a{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;
    align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s}
  .oauth a:hover{background:var(--bg2);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.10)}
  .oauth a:active{transform:scale(.94)}
  .oauth svg{width:22px;height:22px}

  .switchup{margin-top:22px;text-align:center;font-size:14px;color:var(--sub)}
  .switchup a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:2px solid var(--raus)}

  footer{padding:16px;text-align:center;color:var(--sub);font-size:12.5px;border-top:1px solid var(--line);background:#fff}
  footer a{color:var(--ink);text-decoration:none}
  footer .fl{display:inline-flex;gap:14px;justify-content:center;margin-bottom:6px}
  footer a:hover{text-decoration:underline}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(18px);background:var(--ink);color:#fff;
    padding:12px 20px;border-radius:var(--r-chip);font-size:14px;font-weight:600;opacity:0;pointer-events:none;
    transition:.25s;z-index:60;box-shadow:var(--sh-hover)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:560px){
    .card{padding:26px 20px;border:0;box-shadow:none;border-radius:0}
    .card::after{display:none}
    body{background:var(--bg2)}
    .wrap{padding-left:0;padding-right:0}
    .card{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .blob.b3{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .card:focus-within{transform:none}
    .oauth a:hover{transform:none}
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  </div>
  <div class="brand-strip" aria-hidden="true"></div>

  <div class="topline">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="lm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A5F"/><stop offset="1" stop-color="#FF385C"/></linearGradient></defs>
        <path fill="url(#lm)" fill-rule="evenodd" d="M16 2.2c-7.6 0-13.8 6-13.8 13.4 0 4.1 1.8 7.3 4.5 9.1 3 2 6.7 1.6 8.6-1 .7 1.3 2 2.1 3.7 2.1 3.4 0 5.8-2.9 5.8-6.8 0-4-3.3-7.5-8.1-7.5-1 0-1.9.1-2.6.3.6-1.3 1.9-2.1 3.6-2.1 1.3 0 2.4.5 3.1 1.3l1.2-1.5C21.4 6.5 19.5 5.6 17.3 5.6 13 5.6 9.8 8.7 9.8 13.1c0 1 .1 1.9.4 2.7-1-.8-1.6-1.9-1.6-3.3 0-2.6 2-4.6 4.8-4.6 1 0 1.9.2 2.7.6.4-1.1.3-2.1-.5-2.9-1-1-2.7-1.4-4.7-1.1.9-1.3 2.2-2 3.8-2 2.2 0 3.9 1.3 4.5 3.3l1.8-.4C21.6 6.3 19.2 4.4 16 4.4m2.6 12.3c1.8 0 3.3 1.6 3.3 3.7 0 2.2-1.4 3.8-3.2 3.8-1.1 0-1.9-.6-2.2-1.5-.3-.9-.1-1.9.6-2.6.6-.6 1.2-1 1.5-1.9.2-.7.1-1.5 0-1.5z"/>
      </svg>
      BOSS智库知识库
    </div>
    <button class="mini-link" id="helpBtn">需要帮助？</button>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="head">
        <div class="mark">
          <svg width="52" height="52" viewBox="0 0 32 32" aria-hidden="true">
            <defs><linearGradient id="mm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A5F"/><stop offset="1" stop-color="#FF385C"/></linearGradient></defs>
            <path fill="url(#mm)" fill-rule="evenodd" d="M16 2.2c-7.6 0-13.8 6-13.8 13.4 0 4.1 1.8 7.3 4.5 9.1 3 2 6.7 1.6 8.6-1 .7 1.3 2 2.1 3.7 2.1 3.4 0 5.8-2.9 5.8-6.8 0-4-3.3-7.5-8.1-7.5-1 0-1.9.1-2.6.3.6-1.3 1.9-2.1 3.6-2.1 1.3 0 2.4.5 3.1 1.3l1.2-1.5C21.4 6.5 19.5 5.6 17.3 5.6 13 5.6 9.8 8.7 9.8 13.1c0 1 .1 1.9.4 2.7-1-.8-1.6-1.9-1.6-3.3 0-2.6 2-4.6 4.8-4.6 1 0 1.9.2 2.7.6.4-1.1.3-2.1-.5-2.9-1-1-2.7-1.4-4.7-1.1.9-1.3 2.2-2 3.8-2 2.2 0 3.9 1.3 4.5 3.3l1.8-.4C21.6 6.3 19.2 4.4 16 4.4m2.6 12.3c1.8 0 3.3 1.6 3.3 3.7 0 2.2-1.4 3.8-3.2 3.8-1.1 0-1.9-.6-2.2-1.5-.3-.9-.1-1.9.6-2.6.6-.6 1.2-1 1.5-1.9.2-.7.1-1.5 0-1.5z"/>
          </svg>
        </div>
        <h1>欢迎回到 BOSS智库</h1>
        <p>登录后即可检索企业知识库、导入文档与发起智能问答</p>
      </div>

      <!-- 静态演示：一条错误态 -->
      <div class="banner" id="banner" role="alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 17h.01"/></svg>
        <span id="bannerText">用户名或密码错误，请重试。</span>
      </div>

      <form id="form" novalidate>
        <div class="field">
          <label for="account">账号</label>
          <div class="inp" id="wrapAcc">
            <input id="account" name="account" type="text" inputmode="email" placeholder="手机号 / 邮箱 / 用户名" autocomplete="username" value="demo@boss.com">
          </div>
          <div class="msg-err" id="errAcc">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 17h.01"/></svg>
            请输入账号
          </div>
        </div>

        <div class="field">
          <label for="password">密码</label>
          <div class="inp err" id="wrapPwd">
            <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" value="123">
            <button type="button" class="eye" id="eye" aria-label="显示密码" aria-pressed="false">
              <svg id="icoEye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="icoEyeOff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10 10 0 0112 20c-6.5 0-10-8-10-8a18.5 18.5 0 015.06-5.94M9.9 4.24A9 9 0 0112 4c6.5 0 10 8 10 8a18.5 18.5 0 01-2.16 3.19"/><path d="M1 1l22 22"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>
            </button>
          </div>
          <div class="msg-err show" id="errPwd">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 17h.01"/></svg>
            <span id="errPwdTxt">密码错误（演示：正确密码应为 boss）</span>
          </div>
        </div>

        <div class="row">
          <label class="remember"><input type="checkbox" id="remember"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>记住我</label>
          <a href="#" class="forgot" id="forgotLink">忘记密码？</a>
        </div>

        <button type="submit" class="cta" id="cta">
          <span class="spinner" aria-hidden="true"></span>
          <span class="lbl-txt">登录</span>
        </button>
      </form>

      <div class="divider">或使用以下方式登录</div>

      <div class="oauth">
        <a role="button" tabindex="0" aria-label="使用企业微信登录" data-p="企业微信">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9.2 4C5.3 4 2 6.7 2 10c0 1.9 1 3.6 2.6 4.7L4 16.6l2.1-1.1c.4.1.8.2 1.2.2" stroke="#0a8b4a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="9" r=".9" fill="#0a8b4a"/><circle cx="11" cy="9" r=".9" fill="#0a8b4a"/><path d="M14.8 9.2c-3.2 0-5.8 2.2-5.8 5s2.6 5 5.8 5c.6 0 1.2-.1 1.7-.3l1.8.9-.5-1.6c1.3-.9 2.3-2.3 2.3-4 0-2.8-2.6-5-5.8-5z" stroke="#0a8b4a" stroke-width="1.6" stroke-linejoin="round"/><circle cx="13.3" cy="13.6" r=".8" fill="#0a8b4a"/><circle cx="16.4" cy="13.6" r=".8" fill="#0a8b4a"/></svg>
        </a>
        <a role="button" tabindex="0" aria-label="使用钉钉登录" data-p="钉钉">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5c-3.6 0-6.5 2.9-6.5 6.5 0 1 .2 1.9.6 2.7L4 17l3.4-.9c.9.6 2 .9 3.1.9h.2l-1.2 2 2.4-1.5c2.7-.5 4.8-2.9 4.8-5.7 0-3.6-2.9-6.5-6.5-6.5z" stroke="#1a73e8" stroke-width="1.6" stroke-linejoin="round"/><circle cx="10.3" cy="9.6" r=".9" fill="#1a73e8"/><circle cx="13.7" cy="9.6" r=".9" fill="#1a73e8"/><path d="M9.6 12.4c1.2.9 3.6.9 4.8 0" stroke="#1a73e8" stroke-width="1.5" stroke-linecap="round"/></svg>

        </a>
        <a role="button" tabindex="0" aria-label="使用 GitHub 登录" data-p="GitHub">
          <svg viewBox="0 0 24 24" fill="#24292f"><path d="M12 2C6.5 2 2 6.5 2 12c0 4.4 2.9 8.2 6.8 9.5.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.3-3.4-1.3-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.3-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.4 9.4 0 015 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .3.3.6.9.6 1.9v2.8c0 .3.2.6.7.5 3.9-1.3 6.8-5.1 6.8-9.5C22 6.5 17.5 2 12 2z"/></svg>
        </a>
      </div>

      <div class="switchup">还没有企业账号？<a href="#" id="applyLink">申请开通</a></div>
    </div>
  </div>

  <footer>
    <div class="fl"><a href="#">服务协议</a><a href="#">隐私政策</a><a href="#">安全中心</a></div>
    © 2026 BOSS智库 · 企业级智能知识库系统
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var toastEl=$('toast'), toastT;
  function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('show');},1900);}

  /* ---- password show / hide ---- */
  var eye=$('eye'), pwd=$('password'), icoEye=$('icoEye'), icoEyeOff=$('icoEyeOff');
  eye.addEventListener('click',function(){
    var show=pwd.type==='password';
    pwd.type=show?'text':'password';
    eye.setAttribute('aria-pressed',show?'true':'false');
    eye.setAttribute('aria-label',show?'隐藏密码':'显示密码');
    icoEye.style.display=show?'none':'';
    icoEyeOff.style.display=show?'':'none';
    pwd.focus();
  });

  /* ---- field error helpers ---- */
  function setErr(wrapEl,msgEl,on,txt){
    wrapEl.classList.toggle('err',on);
    msgEl.classList.toggle('show',on);
    if(txt) msgEl.lastElementChild.textContent=txt;
  }
  var banner=$('banner'), bannerText=$('bannerText');

  var account=$('account');
  account.addEventListener('input',function(){
    if(account.value.trim()){setErr($('wrapAcc'),$('errAcc'),false);}
  });
  pwd.addEventListener('input',function(){
    setErr($('wrapPwd'),$('errPwd'),false);
    banner.classList.add('hide');
  });

  /* ---- remember me ---- */
  $('remember').addEventListener('change',function(e){toast(e.target.checked?'已开启记住此设备':'已关闭记住我');});

  /* ---- submit: real validation + loading, demo always rejects ---- */
  var form=$('form'), cta=$('cta');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var okAcc=account.value.trim().length>0;
    var okPwd=pwd.value.trim().length>0;
    setErr($('wrapAcc'),$('errAcc'),!okAcc);
    if(!okAcc){account.focus();return;}
    if(!okPwd){setErr($('wrapPwd'),$('errPwd'),true,'请输入密码');pwd.focus();return;}
    // loading
    cta.classList.add('loading'); cta.disabled=true;
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function(){
      cta.classList.remove('loading'); cta.disabled=false;
      if(pwd.value.trim()==='boss'){
        banner.classList.add('hide');
        setErr($('wrapPwd'),$('errPwd'),false);
        toast('登录成功，正在进入知识库…');
      }else{
        bannerText.textContent='用户名或密码错误，请重试。';
        banner.classList.remove('hide');
        setErr($('wrapPwd'),$('errPwd'),true,'密码错误（演示：正确密码应为 boss）');
        pwd.focus(); pwd.select();
      }
    },reduce?200:1100);
  });

  /* ---- third party ---- */
  Array.prototype.forEach.call(document.querySelectorAll('.oauth a'),function(a){
    function act(){toast('正在跳转 '+a.getAttribute('data-p')+' 授权登录…');}
    a.addEventListener('click',function(e){e.preventDefault();act();});
    a.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
  });

  /* ---- misc links ---- */
  $('forgotLink').addEventListener('click',function(e){e.preventDefault();toast('请联系企业管理员重置密码');});
  $('applyLink').addEventListener('click',function(e){e.preventDefault();toast('请通过企业微信向管理员申请账号');});
  $('helpBtn').addEventListener('click',function(){toast('帮助：支持手机号 / 邮箱 / 用户名登录');});
})();
</script>
</body>
</html>
